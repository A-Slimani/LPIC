<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" font-family="sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1020" fill="#ffffff"/>

  <text x="500" y="65" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e1e1e">LPIC Learning Flowchart</text>

  <!-- Start -->
  <ellipse cx="500" cy="160" rx="130" ry="40" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" font-size="18" fill="#1e1e1e">Start: LPIC Objective</text>
  <text x="500" y="178" text-anchor="middle" font-size="18" fill="#1e1e1e">103.1</text>

  <line x1="500" y1="200" x2="500" y2="240" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Learn -->
  <rect x="370" y="240" width="260" height="80" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="275" text-anchor="middle" font-size="19" fill="#1e1e1e">Learn Concept</text>
  <text x="500" y="298" text-anchor="middle" font-size="19" fill="#1e1e1e">+ notes</text>

  <line x1="500" y1="320" x2="500" y2="360" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Practice -->
  <rect x="370" y="360" width="260" height="80" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="395" text-anchor="middle" font-size="19" fill="#1e1e1e">Practice</text>
  <text x="500" y="418" text-anchor="middle" font-size="19" fill="#1e1e1e">in Bash</text>

  <line x1="500" y1="440" x2="500" y2="480" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision diamond -->
  <polygon points="500,480 610,530 500,580 390,530" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="525" text-anchor="middle" font-size="19" fill="#1e1e1e">Self-test</text>
  <text x="500" y="548" text-anchor="middle" font-size="19" fill="#1e1e1e">pass?</text>

  <!-- Yes branch down -->
  <line x1="500" y1="580" x2="500" y2="620" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="515" y="608" font-size="15" fill="#1e1e1e">Yes</text>

  <!-- No branch to left then down to review (simplified: review below) -->
  <!-- For clarity: No goes down to review box, Yes continues - we stack them -->
  <!-- Review box -->
  <rect x="370" y="620" width="260" height="80" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="655" text-anchor="middle" font-size="19" fill="#1e1e1e">No: Review</text>
  <text x="500" y="678" text-anchor="middle" font-size="19" fill="#1e1e1e">weak areas</text>

  <!-- Loop back arrow from review to practice (left side) -->
  <path d="M 370 660 L 300 660 L 300 400 L 370 400" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text x="225" y="535" font-size="15" fill="#1e1e1e" transform="rotate(-90 225,535)" text-anchor="middle">retry</text>

  <line x1="500" y1="700" x2="500" y2="740" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Spaced recall -->
  <rect x="370" y="740" width="260" height="80" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="775" text-anchor="middle" font-size="19" fill="#1e1e1e">Spaced recall</text>
  <text x="500" y="798" text-anchor="middle" font-size="19" fill="#1e1e1e">+ Next objective</text>

  <line x1="500" y1="820" x2="500" y2="860" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- End -->
  <ellipse cx="500" cy="900" rx="130" ry="40" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="908" text-anchor="middle" font-size="19" fill="#1e1e1e">Exam Ready</text>
</svg>
